name: Branch created

on:
  create:

permissions:
  contents: read
  issues: write

jobs:
  branch-created:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest

    steps:
      - name: Show branch information
        run: |
          echo "Branch: ${{ github.ref }}"
          echo "Branch name: ${{ github.ref_name }}"
          echo "Created by: ${{ github.actor }}"